<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5"
    fill="none" stroke="url(#hexGrad)" stroke-width="3" opacity="0.9"/>

  <!-- Inner hexagon (rotated) -->
  <polygon points="50,18 79,34.5 79,65.5 50,82 21,65.5 21,34.5"
    fill="none" stroke="url(#hexGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Circuit nodes -->
  <circle cx="50" cy="4"  r="3" fill="url(#hexGrad)" filter="url(#glow)"/>
  <circle cx="93" cy="27.5" r="3" fill="url(#hexGrad)" filter="url(#glow)"/>
  <circle cx="93" cy="72.5" r="3" fill="url(#hexGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="96" r="3" fill="url(#hexGrad)" filter="url(#glow)"/>
  <circle cx="7"  cy="72.5" r="3" fill="url(#hexGrad)" filter="url(#glow)"/>
  <circle cx="7"  cy="27.5" r="3" fill="url(#hexGrad)" filter="url(#glow)"/>

  <!-- Center spark / lightning bolt -->
  <path d="M54,30 L44,52 L51,52 L46,70 L58,46 L51,46 Z"
    fill="url(#sparkGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Connecting lines from center to outer corners -->
  <line x1="50" y1="18" x2="50" y2="4"   stroke="url(#hexGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="79" y1="34.5" x2="93" y2="27.5" stroke="url(#hexGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="79" y1="65.5" x2="93" y2="72.5" stroke="url(#hexGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="82"  x2="50" y2="96"  stroke="url(#hexGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="65.5" x2="7"  y2="72.5" stroke="url(#hexGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="34.5" x2="7"  y2="27.5" stroke="url(#hexGrad)" stroke-width="1" opacity="0.4"/>
</svg>
